<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Приглашение на той</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#503827,#120c09 75%);
display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;font-family:Georgia,serif;color:#efd2a5}
.wrap{width:min(760px,96vw);text-align:center}
.envelope{cursor:pointer;transition:.5s;filter:drop-shadow(0 25px 35px #000b)}
.envelope:hover{transform:translateY(-5px) scale(1.01)}
.envelope img{width:100%;display:block;border-radius:16px}
.hint{margin-top:16px;letter-spacing:2px;font-size:17px}
.card{display:none;max-height:none;background:#f7ecd9;color:#4b3526;border-radius:18px;overflow:hidden;box-shadow:0 25px 70px #000b;animation:open .7s ease}
@keyframes open{from{opacity:0;transform:scale(.92) translateY(25px)}to{opacity:1;transform:none}}
.inner{padding:48px 30px 38px;background:linear-gradient(#fff8eb,#ead9bd)}
.small{letter-spacing:4px;font-size:15px;color:#8a6747}
.names{font-size:52px;font-style:italic;color:#76502f;margin:15px 0 25px}
.invite{font-size:20px;line-height:1.85;letter-spacing:.4px;margin-bottom:25px;text-align:center}.invite p{margin:0 0 24px}.count{line-height:1.8}
.details{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:18px 0}
.detail{padding:12px 20px;border-top:1px solid #b99b75;border-bottom:1px solid #b99b75}
.count{margin:24px 0;font-size:17px}
.music{border:1px solid #a47d52;border-radius:30px;background:#fff6e7;padding:11px 20px;color:#6d4b2f;cursor:pointer}
.close{display:block;margin:22px auto 0;border:0;background:#6b4930;color:#fff0d2;border-radius:25px;padding:12px 28px;cursor:pointer;font-size:16px}
.note{margin-top:15px;font-size:13px;color:#806b57}
@media(max-width:520px){.names{font-size:40px}.invite{font-size:18px}}

.invite-image{width:100%;height:auto;display:block;margin:0;}
.card .inner{padding:0;background:transparent;}

/* Анимация и стили карты */
.card {
  max-height: 92vh;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.card .inner {
  width: 100%;
}
.invite-image {
  width: 100%;
  height: auto;
  display: block;
  transform-origin: 50% 12%;
  animation: invitationSway 4.5s ease-in-out infinite;
}
@keyframes invitationSway {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  25% { transform: rotate(0.45deg) translateY(-2px); }
  50% { transform: rotate(0deg) translateY(-4px); }
  75% { transform: rotate(-0.45deg) translateY(-2px); }
}
@media (prefers-reduced-motion: reduce) {
  .invite-image { animation: none; }
}

.location-block{
  padding:18px 18px 24px;
  text-align:center;
  background:linear-gradient(#fff8eb,#ead9bd);
}
.location-title{
  margin:0 0 8px;
  font-size:18px;
  letter-spacing:1px;
  color:#76502f;
}
.location-address{
  margin:0 0 14px;
  font-size:17px;
  line-height:1.5;
  color:#4b3526;
}
.map-wrap{
  width:min(420px,92%);
  height:190px;
  margin:0 auto;
  border:2px solid #b99b75;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 8px 24px #0002;
}
.map-wrap iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}
.map-link{
  display:inline-block;
  margin-top:10px;
  color:#6b4930;
  text-decoration:none;
  font-size:14px;
}
</style>
</head>
<body>

<audio id="bgMusic" preload="auto" loop>
  <source src="data:audio/mpeg;base64,SUQzAwAAAAAfdlRJVDIAAAAnAAAB//4dBDUEMgQ1BEEEQgQwBCAAKABTAGUAZgBvAG4ALgBtAGUAKQBUUEUxAAAAQQAAAf/+GAQzBD4EQARMBCAAHQQ4BDoEPgQ7BDAENQQyBCAARgBlAGEAdAAuACAAIARDBDoEOAQgABIEMgQ1BEAERQQ..." type="audio/mp3">
</audio>

<div class="wrap">
  <div class="envelope" id="env" onclick="openCard()">
    <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=1000&auto=format&fit=crop" alt="Конверт">
    <div class="hint">НАЖМИТЕ, ЧТОБЫ ОТКРЫТЬ</div>
  </div>

  <div class="card" id="card">
    <div class="inner">
      <img src="https://sun9-28.userapi.com/impg/IeC62_J09d66f4oV305z4kM6wJ66s1931-15_A/563a34f59c8.jpg?size=1080x1920&quality=95&sign=2f4f22c15144b6bc69363a033c4bc9f1&type=album" class="invite-image" alt="Приглашение">

      <!-- Блок с картой -->
      <div class="location-block">
        <h3 class="location-title">Место проведения</h3>
        <p class="location-address">Ресторан «Алтын Холл»<br>г. Бишкек, ул. Примерная, 123</p>
        <div class="map-wrap">
          <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d46788.13437599049!2d74.52989182167968!3d42.87462110000001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x389eb7dc91b12361%3A0xa2078301142bc3c7!2z0JHQuNGI0LrQtdC6!5e0!3m2!1sru!3skg!4v1700000000000!5m2!1sru!3skg" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
        <a class="map-link" href="https://maps.google.com" target="_blank" rel="noopener">Открыть на карте Google Maps →</a>
      </div>

      <div style="padding: 0 20px 20px 20px;">
        <button class="music" onclick="toggleAudio()">🎵 Музыка</button>
        <button class="close" onclick="closeCard()">Закрыть</button>
      </div>
    </div>
  </div>
</div>

<script>
function openCard(){
  document.getElementById('env').style.display='none';
  document.getElementById('card').style.display='block';
  var a=document.getElementById('bgMusic');
  a.play().catch(function(e){console.log("Autoplay blocked")});
}
function closeCard(){
  document.getElementById('card').style.display='none';
  document.getElementById('env').style.display='block';
  var a=document.getElementById('bgMusic');
  a.pause();
}
function toggleAudio(){
  var a=document.getElementById('bgMusic');
  if(a.paused){a.play();}else{a.pause();}
}
</script>

</body>
</html>
