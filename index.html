<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приглашение на свадьбу — Чингиз & Мадина</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4efe9;
      font-family: 'Cormorant Garamond', serif;
      color: #4a4238;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px 10px;
    }

    /* ЭКРАН С КОНВЕРТОМ */
    .envelope-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #eae3d9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 1s ease, visibility 1s;
    }

    .envelope-overlay.opened {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .envelope {
      width: 320px;
      height: 220px;
      background: #e3dac9;
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #d4c5b3;
    }

    /* Сургучная печать */
    .wax-seal {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #e6c594 0%, #c49a58 70%, #9e7534 100%);
      border-radius: 50%;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      z-index: 10;
      border: 3px solid #b88d4c;
    }

    .wax-seal:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .wax-seal span {
      font-family: 'Great Vibes', cursive;
      font-size: 26px;
      color: #5c4118;
      text-shadow: 1px 1px 1px rgba(255,255,255,0.4);
    }

    .hint-text {
      margin-top: 25px;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8c7a6b;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* ОСНОВНАЯ КАРТОЧКА ПРИГЛАШЕНИЯ */
    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      padding: 40px 25px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #e8e1d7;
      text-align: center;
      position: relative;
      opacity: 0;
      transform: translateY(30px);
      transition: all 1s ease 0.5s;
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card-border {
      border: 1px solid #d4af37;
      padding: 30px 15px;
      border-radius: 8px;
      position: relative;
    }

    .subtitle {
      font-size: 0.95rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #9c8a77;
      margin-bottom: 15px;
    }

    .names {
      font-family: 'Great Vibes', cursive;
      font-size: 3.2rem;
      color: #2c251e;
      margin: 10px 0;
      line-height: 1.2;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: #d4af37;
      margin: 20px auto;
    }

    .invitation-text {
      font-size: 1.25rem;
      line-height: 1.6;
      margin-bottom: 25px;
      font-style: italic;
    }

    .details-box {
      background-color: #faf7f2;
      padding: 20px;
      border-radius: 6px;
      margin-top: 20px;
    }

    .date-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #5a4b3c;
      letter-spacing: 1px;
    }

    .date-highlight {
      font-size: 2rem;
      color: #8c6d3b;
      margin: 5px 0;
      font-weight: 600;
    }

    .location {
      font-size: 1.15rem;
      margin-top: 15px;
      line-height: 1.4;
    }

    .location strong {
      display: block;
      font-size: 1.25rem;
      color: #2c251e;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Оверлей с конвертом и сургучной печатью -->
  <div class="envelope-overlay" id="envelopeOverlay">
    <div class="envelope">
      <div class="wax-seal" id="waxSeal">
        <span>Ч & М</span>
      </div>
    </div>
    <div class="hint-text">Нажмите на печать</div>
  </div>

  <!-- Пригласительная карточка -->
  <div class="card" id="weddingCard">
    <div class="card-border">
      <p class="subtitle">Приглашение на свадьбу</p>
      
      <h1 class="names">Чингиз<br>&<br>Мадина</h1>
      
      <div class="divider"></div>
      
      <p class="invitation-text">
        Разделите с нами радость этого особенного дня, когда создается наша новая семья!
      </p>

      <div class="details-box">
        <p class="date-title">ДАТА И ВРЕМЯ</p>
        <p class="date-highlight">30 АВГУСТА 2026</p>
        
        <div class="divider" style="margin: 10px auto; width: 30px;"></div>
        
        <p class="location">
          Место проведения:<br>
          <strong>г. Токмок, КАРАВАН САРАЙ</strong>
        </p>
      </div>
    </div>
  </div>

  <script>
    const waxSeal = document.getElementById('waxSeal');
    const envelopeOverlay = document.getElementById('envelopeOverlay');
    const weddingCard = document.getElementById('weddingCard');

    waxSeal.addEventListener('click', () => {
      // Анимация открытия
      envelopeOverlay.classList.add('opened');
      weddingCard.classList.add('visible');
    });
  </script>

</body>
</html>
